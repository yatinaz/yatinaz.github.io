<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" aria-label="Multi-Disease fMRI Biomarker Detection thumbnail">
  <defs>
    <radialGradient id="brainBg" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#f7f5f2"/>
      <stop offset="100%" stop-color="#ede9e2"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Brain silhouette -->
  <ellipse cx="390" cy="228" rx="292" ry="180" fill="url(#brainBg)"/>
  <ellipse cx="390" cy="228" rx="292" ry="180" stroke="#c8c0b4" stroke-width="1.8" fill="none"/>
  <path d="M390,52 Q383,108 388,150 Q393,185 390,228" stroke="#d8d2c8" stroke-width="1.2" fill="none"/>

  <!-- Hemisphere labels -->
  <text x="258" y="95" fill="#b8b0a4" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">LEFT</text>
  <text x="522" y="95" fill="#b8b0a4" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="2">RIGHT</text>

  <!-- Edges — rich amber #C17F3C at higher opacity so visible on light -->
  <path d="M344,108 Q322,162 348,224" fill="none" stroke="#C17F3C" stroke-width="1.6" opacity="0.55" stroke-linecap="round"/>
  <path d="M436,108 Q458,162 442,224" fill="none" stroke="#C17F3C" stroke-width="1.6" opacity="0.55" stroke-linecap="round"/>
  <path d="M174,152 Q390,82 606,152" fill="none" stroke="#C17F3C" stroke-width="1.4" opacity="0.38" stroke-linecap="round"/>
  <path d="M174,152 Q262,102 348,104" fill="none" stroke="#C17F3C" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <path d="M606,152 Q518,102 432,104" fill="none" stroke="#C17F3C" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
  <path d="M348,224 Q268,262 192,298" fill="none" stroke="#C17F3C" stroke-width="1.0" opacity="0.30" stroke-linecap="round"/>
  <path d="M442,224 Q522,262 598,298" fill="none" stroke="#C17F3C" stroke-width="1.0" opacity="0.30" stroke-linecap="round"/>
  <path d="M192,298 Q390,268 598,298" fill="none" stroke="#C17F3C" stroke-width="0.8" opacity="0.22" stroke-linecap="round"/>

  <!-- DMN disruption: dashed -->
  <path d="M348,104 Q390,62 432,104" fill="none" stroke="#C17F3C" stroke-width="2.6" opacity="0.40" stroke-linecap="round" stroke-dasharray="6 5"/>
  <!-- Red X -->
  <line x1="383" y1="78" x2="397" y2="66" stroke="#dc2626" stroke-width="2.0"/>
  <line x1="397" y1="78" x2="383" y2="66" stroke="#dc2626" stroke-width="2.0"/>

  <!-- Region nodes -->
  <circle cx="174" cy="152" r="12" fill="#ffffff" stroke="#C17F3C" stroke-width="1.6"/>
  <text x="134" y="148" fill="#6b7280" font-size="9" font-family="monospace" text-anchor="middle">L-PFC</text>
  <circle cx="606" cy="152" r="12" fill="#ffffff" stroke="#C17F3C" stroke-width="1.6"/>
  <text x="648" y="148" fill="#6b7280" font-size="9" font-family="monospace" text-anchor="middle">R-PFC</text>
  <!-- Key DMN hubs — thicker border -->
  <circle cx="348" cy="104" r="15" fill="#ffffff" stroke="#C17F3C" stroke-width="2.4"/>
  <text x="316" y="88" fill="#C17F3C" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Ins_L</text>
  <circle cx="432" cy="104" r="15" fill="#ffffff" stroke="#C17F3C" stroke-width="2.4"/>
  <text x="464" y="88" fill="#C17F3C" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">ACC_L</text>
  <!-- Thalami -->
  <circle cx="348" cy="224" r="12" fill="#f7f5f2" stroke="#C17F3C" stroke-width="1.8"/>
  <text x="308" y="248" fill="#9ca3af" font-size="9" font-family="monospace" text-anchor="middle">L-Thal</text>
  <circle cx="442" cy="224" r="12" fill="#f7f5f2" stroke="#C17F3C" stroke-width="1.8"/>
  <text x="484" y="248" fill="#9ca3af" font-size="9" font-family="monospace" text-anchor="middle">R-Thal</text>
  <!-- Temporal -->
  <circle cx="192" cy="298" r="10" fill="#ffffff" stroke="#C17F3C" stroke-width="1.2" opacity="0.8"/>
  <text x="152" y="296" fill="#9ca3af" font-size="9" font-family="monospace" text-anchor="middle">L-Temp</text>
  <circle cx="598" cy="298" r="10" fill="#ffffff" stroke="#C17F3C" stroke-width="1.2" opacity="0.8"/>
  <text x="640" y="296" fill="#9ca3af" font-size="9" font-family="monospace" text-anchor="middle">R-Temp</text>

  <!-- Callout -->
  <line x1="390" y1="72" x2="390" y2="130" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
  <rect x="298" y="130" width="184" height="34" rx="3" fill="#fff5f5" stroke="#dc2626" stroke-width="1"/>
  <text x="390" y="145" fill="#dc2626" font-size="8.5" font-family="monospace" text-anchor="middle">Insula–cingulate hypoconnectivity</text>
  <text x="390" y="157" fill="#b07070" font-size="7.5" font-family="monospace" text-anchor="middle">top predictive FC pair (LR coeff 0.87)</text>

  <!-- Right panel -->
  <rect x="648" y="176" width="132" height="70" rx="3" fill="#f7f5f2" stroke="#e5e0d8" stroke-width="1"/>
  <text x="658" y="192" fill="#9ca3af" font-size="8" font-family="monospace">FC matrix →</text>
  <text x="658" y="207" fill="#374151" font-size="8.5" font-family="monospace">Schizophrenia</text>
  <text x="658" y="220" fill="#374151" font-size="8.5" font-family="monospace">Parkinson's</text>
  <text x="658" y="236" fill="#9ca3af" font-size="7.5" font-family="monospace">AUC 0.718 / 0.677</text>

  <text x="390" y="438" fill="#c8c0b4" font-size="8.5" font-family="monospace" text-anchor="middle">resting-state fMRI · functional connectivity · 326 subjects</text>
</svg>
